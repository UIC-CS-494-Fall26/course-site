# The toy app runs in one container. The live WordPress warm-up target needs the
# database service and a one-time install (see targets/README.md).
#   docker compose -f targets/docker-compose.yml up -d toydb        # just the toy app
#   docker compose -f targets/docker-compose.yml up -d              # toy app + WordPress
# Everything binds to 127.0.0.1 only.
services:
  toydb:
    build: ../toydb
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8880:8880"

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wppw
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:                       # the live warm-up target (one plugin, installed per README)
    image: wordpress:6.6-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppw
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "127.0.0.1:8881:80"
