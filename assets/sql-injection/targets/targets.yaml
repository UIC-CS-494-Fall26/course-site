# Targets for the SQL-injection hunt.
# Every CVE below was checked against the NVD API as CWE-89 and confirmed
# downloadable on 2026-11-18. `reproduced` turns true only after a safe probe
# shows a vulnerable-vs-fixed difference across the pinned versions.
#
# `context` maps each target to a row of the "Where injection hides" slide.
# The answer key lives in ../../sql-injection-key/.

- name: wp-polls
  cve: CVE-2024-13426
  cwe: CWE-89
  app: WP-Polls (WordPress plugin, PHP)
  slug: wp-polls
  vulnerable: "2.77.2"
  fixed: "2.77.3"
  auth: unauthenticated
  injection: a cookie
  context: string value, via a cookie
  reproduced: true  # 2026-11-18: second-order sink confirmed vuln vs fix at polls-logs.php:98

