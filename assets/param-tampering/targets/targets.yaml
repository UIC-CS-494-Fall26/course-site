# Targets for the parameter-tampering hunt.
# Every CVE below was checked against the NVD API (services.nvd.nist.gov) and its
# fix (commit or plugin release diff) on 2026-11-16.
# `reproduced` turns true only after the tampering request succeeds against the
# vulnerable version and fails against the fixed version on a local Docker run.
#
# The `shape` field maps each target to a row of the "Six shapes" slide.
# The `hint` field is for students. The answer key lives in ../../param-tampering-key/.

- name: ninja-forms
  cve: CVE-2026-65052
  cwe: CWE-472
  app: Ninja Forms (WordPress plugin, PHP)
  repo: https://plugins.svn.wordpress.org/ninja-forms/
  vulnerable: "3.14.8"
  fixed: "3.14.9"
  run: wordpress image + plugin zip from downloads.wordpress.org
  port: 8781
  shape: select / radio options
  hint: A form with a priced drop-down and a calculated total.
  reproduced: false

- name: wp-time-slots
  cve: CVE-2024-33543
  cwe: CWE-862 (NVD); Wordfence and Patchstack list the bug as price manipulation
  app: WP Time Slots Booking Form (WordPress plugin, PHP)
  repo: https://plugins.svn.wordpress.org/wp-time-slots-booking-form/
  vulnerable: "1.2.06"
  fixed: "1.2.07"
  run: wordpress image + plugin zip from downloads.wordpress.org
  port: 8782
  shape: JavaScript-computed field
  hint: A booking form that shows a running total.
  reproduced: false

- name: kanboard
  cve: CVE-2026-29056
  cwe: CWE-915
  app: Kanboard (PHP)
  repo: https://github.com/kanboard/kanboard
  vulnerable: v1.2.50
  fixed: v1.2.51
  fix_commit: f3ac87ce
  run: kanboard/kanboard:v1.2.50 (Docker Hub)
  port: 8783
  shape: no field at all (mass assignment)
  hint: Users can join through an invite link.
  reproduced: true  # 2026-11-16: role=app-admin accepted on v1.2.50, stripped on v1.2.51

